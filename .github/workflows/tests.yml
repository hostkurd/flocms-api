name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      # Only the extensions FloCMS requires on shared hosting.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo, gd
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run tests
        run: vendor/bin/phpunit
