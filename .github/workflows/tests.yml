name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.1', '8.2', '8.3', '8.4']
        include:
          # XAMPP users run FloCMS on Windows
          - { os: windows-latest, php: '8.1' }
          - { os: windows-latest, php: '8.4' }

    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # The extensions FloCMS requires on shared hosting, plus pdo_sqlite for
      # the integration tests and pcntl for the concurrency tests.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo, gd, pcntl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      # Until hostkurd/flocms-cli 2.0.0 is on Packagist, use its release branch
      - name: Use the unreleased flocms-cli 2.0
        shell: bash
        run: |
          if ! composer show --all --no-interaction hostkurd/flocms-cli 2.0.0 > /dev/null 2>&1; then
            composer config repositories.flocms-cli vcs https://github.com/hostkurd/flocms-cli
            composer require --no-update --no-interaction "hostkurd/flocms-cli:dev-release/2.0.0 as 2.0.0"
          fi

      # Until hostkurd/flocms-core 2.8.0 is on Packagist, use its pull request branch
      - name: Use the unreleased flocms-core 2.8
        shell: bash
        run: |
          if ! composer show --all --no-interaction hostkurd/flocms-core 2.8.0 > /dev/null 2>&1; then
            composer config repositories.flocms-core vcs https://github.com/hostkurd/flocms-core
            composer require --no-update --no-interaction "hostkurd/flocms-core:dev-feat/core-2.8-security-tools as 2.8.0"
          fi

      - name: Install dependencies
        run: |
          composer update --no-interaction --no-progress --prefer-dist
          # The tests check the requirements in composer.json
          git checkout -- composer.json

      - name: Lint
        shell: bash
        run: |
          php -l bin/flo-api > /dev/null
          find src tests database -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run tests (MySQL tests are skipped here)
        run: vendor/bin/phpunit

  database:
    name: ${{ matrix.db.name }} (PHP 8.3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: 'MariaDB 10.11', image: 'mariadb:10.11' }
          - { name: 'MySQL 8.0', image: 'mysql:8.0' }

    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: flocms_api_test
          MARIADB_DATABASE: flocms_api_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo, gd, pcntl
          coverage: none
          tools: composer:v2

      - name: Use the unreleased flocms-cli 2.0
        run: |
          if ! composer show --all --no-interaction hostkurd/flocms-cli 2.0.0 > /dev/null 2>&1; then
            composer config repositories.flocms-cli vcs https://github.com/hostkurd/flocms-cli
            composer require --no-update --no-interaction "hostkurd/flocms-cli:dev-release/2.0.0 as 2.0.0"
          fi

      # Until hostkurd/flocms-core 2.8.0 is on Packagist, use its pull request branch
      - name: Use the unreleased flocms-core 2.8
        shell: bash
        run: |
          if ! composer show --all --no-interaction hostkurd/flocms-core 2.8.0 > /dev/null 2>&1; then
            composer config repositories.flocms-core vcs https://github.com/hostkurd/flocms-core
            composer require --no-update --no-interaction "hostkurd/flocms-core:dev-feat/core-2.8-security-tools as 2.8.0"
          fi

      - name: Install dependencies
        run: |
          composer update --no-interaction --no-progress --prefer-dist
          # The tests check the requirements in composer.json
          git checkout -- composer.json

      - name: Run integration tests against ${{ matrix.db.name }}
        env:
          FLO_TEST_MYSQL_HOST: 127.0.0.1
          FLO_TEST_MYSQL_PORT: 3306
          FLO_TEST_MYSQL_USER: root
          FLO_TEST_MYSQL_PASS: root
          FLO_TEST_MYSQL_NAME: flocms_api_test
        run: vendor/bin/phpunit --testsuite integration
